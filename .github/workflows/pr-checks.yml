name: Required PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: required-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  pr_branch_flow_guard:
    name: quality / branch-flow-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce feature -> dev -> staging -> main flow (chained work-branch bases allowed)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          WORK_BRANCH_PATTERN='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)/[a-z0-9._-]+$'

          echo "Validating PR branch flow: ${HEAD_REPOSITORY}:${HEAD_REF} -> ${REPOSITORY}:${BASE_REF}"

          case "${BASE_REF}" in
            dev)
              if [[ "${HEAD_REF}" =~ ${WORK_BRANCH_PATTERN} ]]; then
                exit 0
              fi
              echo "PRs targeting dev must come from a typed work branch such as feat/*, fix/*, chore/*, docs/*, test/*, or ci/*."
              exit 1
              ;;
            staging)
              if [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" && "${HEAD_REF}" == "dev" ]]; then
                exit 0
              fi
              echo "PRs targeting staging must come only from this repository's dev branch. Feature branches must target dev first."
              exit 1
              ;;
            main)
              if [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" && "${HEAD_REF}" == "staging" ]]; then
                exit 0
              fi
              echo "PRs targeting main must come only from this repository's staging branch. Production promotion must pass through dev and staging."
              exit 1
              ;;
            *)
              # Chained/stacked PRs: a typed work branch may target its parent
              # typed work branch when both live in this repository.
              if [[ "${BASE_REF}" =~ ${WORK_BRANCH_PATTERN} ]]; then
                if [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" && "${HEAD_REF}" =~ ${WORK_BRANCH_PATTERN} ]]; then
                  exit 0
                fi
                echo "PRs targeting a work branch (${BASE_REF}) must come from another typed work branch in this repository (chained PRs)."
                exit 1
              fi
              echo "Unsupported PR base branch: ${BASE_REF}. Allowed bases are dev, staging, main, or a typed work branch of this repository for chained PRs."
              exit 1
              ;;
          esac

  quality_format:
    name: quality / format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  backend_lint_build_unit:
    name: backend / lint-build-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuestro-breaking/backend lint
      - run: pnpm --filter @nuestro-breaking/backend build
      - run: pnpm --filter @nuestro-breaking/backend test --runInBand

  backend_postgres_e2e:
    name: backend / postgres-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run disposable PostgreSQL 16 E2E tests
        run: pnpm --filter @nuestro-breaking/backend test:e2e --runInBand

  frontend_live_check_in:
    name: frontend / live-check-in
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on the host runner, not in the Playwright image: the forked backend
    # starts PostgreSQL with Testcontainers, which needs the host Docker daemon.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and its OS dependencies
        timeout-minutes: 5
        run: pnpm --filter @nuestro-breaking/frontend exec playwright install --with-deps chromium
      - run: pnpm --filter @nuestro-breaking/frontend test:e2e:live
      - name: Upload live Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-artifacts-${{ github.run_id }}
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  frontend_lint_build:
    name: frontend / lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuestro-breaking/frontend lint
      - run: pnpm --filter @nuestro-breaking/frontend build

  frontend_playwright_shard:
    name: frontend / playwright shard (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their OS dependencies ship in the official image, so no
    # `playwright install --with-deps` (its apt step has hung on Ubuntu mirrors).
    # The image tag MUST match the exact `@playwright/test` version in pnpm-lock.yaml;
    # the "browser in image" step fails fast when they drift.
    defaults:
      run:
        # Container steps default to `sh`; the scripts below need bash.
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # UID 1001 matches the GitHub-hosted runner user, so the checked-out
      # workspace and the pnpm/tool cache stay writable (Playwright CI docs).
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # `total` must equal the number of entries in `shard`.
        shard: [1, 2]
        total: [2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Check the image ships the browser for the installed @playwright/test
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          INSTALLED="$(pnpm exec playwright --version)"
          BROWSER="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          echo "Installed: ${INSTALLED}; expected Chromium at ${BROWSER}"
          if [[ ! -x "${BROWSER}" ]]; then
            echo "::error::The Playwright container image has no Chromium for ${INSTALLED}. Bump the image tag in .github/workflows/pr-checks.yml to match @playwright/test in pnpm-lock.yaml."
            exit 1
          fi
      - run: pnpm --filter @nuestro-breaking/frontend test:e2e --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          # Serve a production build (vite build + preview) instead of the dev server.
          NB_E2E_PREVIEW: '1'
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Stable required-check name that aggregates the shard matrix.
  frontend_playwright:
    name: frontend / playwright
    needs: frontend_playwright_shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Playwright shard to pass
        env:
          SHARD_RESULT: ${{ needs.frontend_playwright_shard.result }}
        run: |
          echo "Playwright shard job result: ${SHARD_RESULT}"
          if [[ "${SHARD_RESULT}" != "success" ]]; then
            exit 1
          fi
